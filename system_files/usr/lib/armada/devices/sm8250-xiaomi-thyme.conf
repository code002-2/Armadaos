ARMADA_DEVICE_ID=sm8250-xiaomi-thyme
ARMADA_DEVICE_NAME='Xiaomi Mi 10S'
ARMADA_SOC_CLASS=SM8250

# 6.67" 1080x2340 portrait AMOLED (CSOT MP42020B DSC). The phone boots
# portrait (like the handhelds); gamescope applies the rotation shader.
ARMADA_PANEL_TYPE=internal
ARMADA_PANEL_ORIENTATION=normal

# No built-in physical controls; touch is primary, external controllers via
# Bluetooth/USB. Touch is the in-kernel ST FTS driver (a real input device,
# no userspace daemon needed).
ARMADA_GAMEPAD_QUIRK=none

# SM8250 mainline suspend; device-env falls back to fake when s2idle is
# unavailable on this kernel.
ARMADA_SUSPEND_MODE=s2idle

# 90Hz AMOLED, no HDR metadata.
ARMADA_HDR_NITS=0

# thyme boots from the Android boot_a/boot_b partition through the original
# Xiaomi ABL (no UEFI/ESP): the kernel payload is a plain Android boot.img
# flashed with fastboot, and the on-device OTA regen rewrites the CURRENT
# slot's boot partition (androidboot.slot_suffix in /proc/cmdline; falls
# back to boot_b when booted without Android kargs, e.g. from an initramfs
# shell).
_thyme_slot=$(sed -n 's/.*androidboot\.slot_suffix=\([ab]\).*/\1/p' /proc/cmdline 2>/dev/null)
_thyme_slot=${_thyme_slot:-b}
ARMADA_BOOTIMG_OUT=/dev/disk/by-partlabel/boot_${_thyme_slot}
unset -v _thyme_slot
ARMADA_BOOTIMG_STAMP=/var/lib/armada/bootimg.id

# Partitions the flash.sh wrapper writes (export-fastboot-images.sh). thyme
# has A/B boot+dtbo; flash both so the image boots regardless of the active
# slot. The root goes to the Android 'userdata' partition (single-system).
ARMADA_BOOT_PARTS="boot_a boot_b"
ARMADA_DTBO_PARTS="dtbo_a dtbo_b"

# Device-specific boot.img inputs. The thyme kernel tree builds the thyme
# (and -logdump debug) DTBs; the vendor ABL needs the header-v1 geometry
# verified on this device (kernel-tree thyme-camera/tools/pack-bootimg.py):
# 2048-byte pages, kernel/tags at 0x10000000, DTB appended after the gzip
# stream (the ABL scans it and matches qcom,msm-id/board-id).
ARMADA_DTB_LIST=/usr/lib/armada/supported-dtbs.sm8250-xiaomi-thyme
ARMADA_BOOTIMG_ARGS_FILE=/usr/lib/armada/bootimg-args.sm8250-xiaomi-thyme
# ABL/header-v1 geometry, sourced by export-fastboot-images.sh +
# armada-bootimg-update so they can't drift (a mismatch ships an unbootable
# boot image).
ARMADA_BOOTIMG_ARGS="--base 0x00000000 --pagesize 2048 --kernel_offset 0x10000000 --tags_offset 0x10000000 --header_version 1"

# header-v1 cmdline is 512 bytes (extra_cmdline has 1024, but keep the same
# conservative cap as sheng until the ABL's overflow handling is confirmed).
ARMADA_CMDLINE_MAX=512

# BLS options line to /KERNEL cmdline, shared so build and on-device regen cannot
# drift. ostree= leads so a truncated header loses tuning kargs, not the root
# pointer; returns 1 without it, since that /KERNEL could never reach the rootfs.
armada_bootimg_cmdline() {
    local t ostree_arg="" rest="" rflags=""
    # Unquoted word splitting also globs; 'local -' scopes the noglob to here.
    local -
    set -f
    for t in $1; do
        case "${t}" in
            console=ttyS0) continue ;;
            ostree=*) ostree_arg="${t}" ;;
            rootflags=*) rflags="${rflags:+${rflags},}${t#rootflags=}" ;;
            *) rest="${rest} ${t}" ;;
        esac
    done
    [ -n "${ostree_arg}" ] || return 1
    rflags="${rflags//,space_cache=v2/}"
    [ -n "${rflags}" ] && rest="${rest} rootflags=${rflags}"
    printf '%s%s' "${ostree_arg}" "${rest}"
}

# Path-free digest of the real boot files (kernel initrd dtb...): ostree
# paths miss in-place regeneration, and deployed mtimes are epoch-zero.
armada_bootimg_content_id() {
    sha256sum "$@" | awk '{print $1}' | tr '\n' ' '
}
# Args: linux initrd options dtb_list args_file content_id.
armada_bootimg_id() {
    { printf '%s\n%s\n%s\n%s\n' "$1" "$2" "$3" "$6"; cat "$4" "$5"; } | sha256sum | cut -d' ' -f1
}

# Highest-version BLS entry under $1/loader/entries — ostree makes the
# next-boot deployment the highest version.
armada_default_bls_entry() {
    local f v
    for f in "$1"/loader/entries/*.conf; do
        [ -f "$f" ] || continue
        v=$(sed -n 's/^version //p' "$f" | head -1)
        printf '%s\t%s\n' "${v:-0}" "$f"
    done | sort -rn | head -1 | cut -f2
}
