# Xiaomi Mi 10S (thyme), SM8250 + WCD938x + CS35L41.
#
# The two CS35L41 smart amps drive the stereo speakers (TERT MI2S).
# The earpiece is an INDEPENDENT receiver on the WCD938x EAR output —
# it is NOT the top speaker — so its audio goes through the
# RX_CODEC_DMA_RX_0 backend, not the CS35L41 pair.
#
# Validated on-device earpiece chain (see VoiceCall.conf for calls):
#   MM1 FE -> RX_CODEC_DMA_RX_0 -> rxmacro "RX_MACRO RX0 MUX"(AIF1_PB)
#   -> "RX INT0_1 MIX1 INP0"(RX0) -> INT0/DEM -> HPHL_OUT -> IN1_HPHL
#   -> RX1 -> RDAC3_MUX(RX1) -> EAR_RDAC -> EAR PGA -> EAR -> Earpiece
#
# Capture adapted from royka1/Xiaomi-Apollo-pmOS-packages,
# commit 4c52c8bc8f8bd23a0e31dcd944a15f838777c3e2.

SectionVerb {
	EnableSequence [
		# NOTE: do NOT switch "RX HPH Mode" here. CLS_H_LOHIFI (the
		# stock mixer_paths value) silences the earpiece entirely on
		# this board with the mainline driver; the driver default
		# (normal class-H, index 0) is the one that produces sound.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia3' 1"
		cset "name='L Analog PCM Volume' 20"
		cset "name='R Analog PCM Volume' 20"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia3' 0"
		cset "name='L Analog PCM Volume' 0"
		cset "name='R Analog PCM Volume' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo speakers (CS35L41 L/R over TERT MI2S)"
	ConflictingDevice [ "Earpiece" ]
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='L Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Independent receiver on the WCD938x EAR output"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		# Media stays off the speakers while the receiver is active.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		# rxmacro: soundwire AIF1 playback into interpolator INT0.
		# EAR mode selects the RX0/INT0 analog output to the EAR pin
		# (RX0_HPH_L_EAR_SEL); without it the earpiece stays silent.
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		# WCD938x: RX1 -> ear DAC -> ear PA -> EAR pin.
		cset "name='RDAC3_MUX' RX1"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='Earpiece Switch' 1"
		# EAR_PA Volume: 0 = +6 dB (loudest) .. 16 = -18 dB (inverted
		# table). Keep a moderate fixed analog gain; userspace volume
		# rides the digital control below.
		cset "name='EAR_PA Volume' 4"
		cset "name='RX_RX0 Digital Volume' 84"
	]
	DisableSequence [
		cset "name='EAR_RDAC Switch' 0"
		cset "name='Earpiece Switch' 0"
		cset "name='EAR_PA Volume' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackVolume "RX_RX0 Digital Volume"
		PlaybackMixer "RX_RX0 Digital Volume"
	}
}

SectionDevice."InternalMic" {
	Comment "Built-in microphone (AMIC5)"
	EnableSequence [
		# Same primary microphone as the stock speaker-mic path:
		# AMIC5 -> ADC4/INP5 -> SWR ADC3 -> DEC0 -> TX DMA 3.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 15"
		cset "name='TX_DEC0 Volume' 98"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "ADC4 Volume"
	}
}
