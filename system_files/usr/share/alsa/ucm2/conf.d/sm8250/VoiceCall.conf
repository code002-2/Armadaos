# Xiaomi Mi 10S (thyme): voice call routing.
#
# Downlink rides the CS-VOICE FE (hw:${CardId},2) into the chosen backend:
#   Earpiece: RX_CODEC_DMA_RX_0 -> WCD938x EAR output (independent receiver,
#             the kernel's "RX_CODEC_DMA_RX_0 Voice Mixer CS-Voice" control)
#   Speaker:  TERT MI2S -> CS35L41 stereo pair (speakerphone)
#
# Uplink is the verified AMIC5 capture chain, same as HiFi.
SectionVerb {
    EnableSequence [
        # Class-H amp left at driver default; see HiFi.conf note.
        cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
        cset "name='L Analog PCM Volume' 10"
        cset "name='R Analog PCM Volume' 10"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' ADC3"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='HDR34 MUX' NO_HDR34"
        cset "name='ADC4 MUX' INP5"
        cset "name='ADC4 Switch' 1"
        cset "name='ADC4_MIXER Switch' 1"
        cset "name='TX3 MODE' ADC_NORMAL"
        cset "name='ADC4 Volume' 15"
        cset "name='TX_DEC0 Volume' 98"
    ]
    DisableSequence [
        cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 0"
        cset "name='RX_CODEC_DMA_RX_0 Voice Mixer CS-Voice' 0"
        cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 0"
        cset "name='L Digital PCM Volume' 817"
        cset "name='R Digital PCM Volume' 817"
    ]
    Value { TQ "Voice" }
}

SectionDevice."Earpiece" {
    Comment "Receiver (independent earpiece on WCD938x EAR)"
    ConflictingDevice [ "Speaker" ]
    EnableSequence [
        # Voice downlink through the WCD codec, same EAR chain as HiFi.
        cset "name='RX_CODEC_DMA_RX_0 Voice Mixer CS-Voice' 1"
        cset "name='RX_EAR Mode Switch' 1"
        cset "name='RX_MACRO RX0 MUX' AIF1_PB"
        cset "name='RX INT0_1 MIX1 INP0' RX0"
        cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
        cset "name='RDAC3_MUX' RX1"
        cset "name='EAR_RDAC Switch' 1"
        cset "name='Earpiece Switch' 1"
        # Inverted table: 0 = +6 dB loudest, 16 = -18 dB. Calls need
        # more acoustic gain than media; 4 keeps it at ~0 dB analog.
        cset "name='EAR_PA Volume' 4"
        cset "name='RX_RX0 Digital Volume' 90"
    ]
    DisableSequence [
        cset "name='EAR_RDAC Switch' 0"
        cset "name='Earpiece Switch' 0"
        cset "name='EAR_PA Volume' 0"
        cset "name='RX_CODEC_DMA_RX_0 Voice Mixer CS-Voice' 0"
        cset "name='RX_EAR Mode Switch' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},2"
        PlaybackChannels 1
        PlaybackVolume "RX_RX0 Digital Volume"
    }
}

SectionDevice."Speaker" {
    Comment "Speakerphone (CS35L41 stereo pair)"
    ConflictingDevice [ "Earpiece" ]
    EnableSequence [
        cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 1"
        cset "name='L Digital PCM Volume' 769"
        cset "name='R Digital PCM Volume' 769"
    ]
    DisableSequence [
        cset "name='TERT_MI2S_RX Voice Mixer CS-Voice' 0"
    ]
    Value {
        PlaybackPriority 50
        PlaybackPCM "hw:${CardId},2"
        PlaybackChannels 1
        PlaybackVolume "R Digital PCM Volume"
    }
}

SectionDevice."InternalMic" {
    Comment "Built-in microphone (AMIC5)"
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},1"
        CaptureChannels 1
        CaptureVolume "ADC4 Volume"
    }
}
